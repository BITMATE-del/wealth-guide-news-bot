<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그룹 동기화 관리</title><style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#17212f;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:30px auto;padding:0 18px}.panel{background:white;border:1px solid #e7eaf0;border-radius:14px;padding:22px;margin:15px 0}.muted{color:#667488;font-size:13px}h1{font-size:25px;margin:0 0 7px}h2{font-size:18px;margin:0 0 16px}input,select,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #d9e0ea}input,select{width:100%;background:white}button{background:#1769e0;color:white;border-color:#1769e0;cursor:pointer;font-weight:600}button.secondary{color:#334155;background:white;border-color:#d9e0ea}button:disabled{opacity:.5;cursor:default}label{display:block;font-size:13px;font-weight:600;margin:13px 0 6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.hide{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:white;color:#536173;border-color:#e0e5ef}.tabs button.active{background:#1769e0;color:white;border-color:#1769e0}.item{border-bottom:1px solid #e8ebef;padding:12px 0}.item:last-child{border:0}.status{font-size:12px;color:#17804c}.warning{color:#bd4c2c}.inline{width:auto}.wide{width:100%;margin-top:14px}.list{max-height:320px;overflow:auto}.check{display:flex;align-items:center;gap:9px;padding:9px;border-bottom:1px solid #eee}.check input{width:auto}#notice{position:fixed;bottom:18px;right:18px;background:#1d2939;color:white;padding:12px 18px;border-radius:10px;display:none;max-width:340px}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{align-items:flex-start}main{margin:16px auto}.panel{padding:16px}}
</style></head><body><main><div class="row"><div><h1>그룹 동기화</h1><p class="muted">여러 관리자 계정과 전달 그룹을 한곳에서 관리합니다.</p></div><button id="logout" class="secondary hide" onclick="signout()">로그아웃</button></div>
<section class="panel" id="login"><h2>관리자 로그인</h2><label>관리자 비밀번호</label><input id="adminPassword" type="password" autocomplete="current-password"><button class="wide" onclick="signin()">로그인</button></section>
<div id="workspace" class="hide"><nav class="tabs"><button data-tab="overview" class="active" onclick="tab('overview')">대시보드</button><button data-tab="accounts" onclick="tab('accounts')">계정 관리</button><button data-tab="settings" onclick="tab('settings')">전달 설정</button><button data-tab="history" onclick="tab('history')">전송 기록</button></nav>
<section id="overview" class="panel"><h2>운영 현황</h2><div id="summary" class="grid"></div><p class="muted">연결된 계정만 자동 전송할 수 있습니다. 실패한 전송은 전송 기록에 표시됩니다.</p></section>
<section id="accounts" class="panel hide"><h2>관리자 계정</h2><div id="accountList"></div><h2 style="margin-top:20px">계정 추가</h2><div class="tabs"><button id="phoneTab" class="active" onclick="authTab('phone')">전화번호 인증</button><button id="sessionTab" onclick="authTab('session')">세션 등록</button></div>
<div id="phoneBox"><label>계정 별칭</label><input id="phoneLabel" placeholder="예: 관리자 A"><label>전화번호</label><input id="phone" placeholder="+821012345678"><button class="wide" onclick="sendCode()">인증코드 받기</button><div id="verifyBox" class="hide"><label>인증코드</label><input id="code" autocomplete="one-time-code"><label>2단계 인증 비밀번호 (필요한 경우)</label><input id="twofa" type="password"><button class="wide" onclick="verify()">계정 연결</button></div></div>
<div id="sessionBox" class="hide"><label>계정 별칭</label><input id="sessionLabel" placeholder="예: 관리자 B"><label>본인 계정의 StringSession</label><input id="stringSession" type="password" autocomplete="off"><button class="wide" onclick="importSession()">세션 연결</button></div></section>
<section id="settings" class="panel hide"><h2>새 전달 설정</h2><p class="muted">메인방 선택 → 서브방 선택 → 전송 계정 선택</p><label>메인방을 읽을 계정</label><select id="watcher" onchange="loadSource()"></select><label>메인방</label><select id="source"></select><label>전달할 서브방</label><div id="targets" class="list"></div><label>메시지를 작성할 계정</label><select id="sendMode" onchange="toggleFixed()"><option value="same">원본 작성자 계정</option><option value="fixed">지정 계정</option></select><div id="fixedBox" class="hide"><label>지정 계정</label><select id="fixed"></select></div><button class="wide" onclick="createRoutes()">선택한 그룹 연결하기</button><h2 style="margin-top:28px">현재 전달 설정</h2><div id="routeList"></div></section>
<section id="history" class="panel hide"><h2>최근 전송 기록</h2><div id="logList"></div></section></div></main><div id="notice"></div>
<script>
let csrf="",accounts=[],routes=[],token="",dialogs=[];const $=id=>document.getElementById(id);
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function notice(s){$("notice").textContent=s;$("notice").style.display="block";setTimeout(()=>$("notice").style.display="none",4500)}
async function api(path,method="GET",body){const r=await fetch("/api"+path,{method,credentials:"same-origin",headers:{"Content-Type":"application/json","x-csrf-token":csrf},body:body===undefined?undefined:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.detail||"요청에 실패했습니다");return v}
async function run(f){try{await f()}catch(e){notice(e.message)}}
function tab(t){document.querySelectorAll("#workspace>section").forEach(e=>e.classList.toggle("hide",e.id!==t));document.querySelectorAll(".tabs [data-tab]").forEach(e=>e.classList.toggle("active",e.dataset.tab===t))}
function authTab(t){$("phoneBox").classList.toggle("hide",t!=="phone");$("sessionBox").classList.toggle("hide",t!=="session");$("phoneTab").classList.toggle("active",t==="phone");$("sessionTab").classList.toggle("active",t==="session")}
async function signin(){await run(async()=>{const v=await api("/login","POST",{password:$("adminPassword").value});csrf=v.csrf;$("adminPassword").value="";await start()})}
async function signout(){await run(async()=>{await api("/logout","POST");location.reload()})}
async function start(){const m=await api("/me");if(!m.logged_in)return;csrf=m.csrf;$("login").classList.add("hide");$("workspace").classList.remove("hide");$("logout").classList.remove("hide");await refresh()}
function accountName(id){const a=accounts.find(x=>x.id===id);return a?safe(a.label):"연결 해제된 계정"}
async function refresh(){await run(async()=>{[accounts,routes]=await Promise.all([api("/accounts"),api("/routes")]);$("summary").innerHTML=[["등록 계정",accounts.length],["연결 계정",accounts.filter(a=>a.connected).length],["작동 중인 전달 규칙",routes.filter(r=>r.active).length]].map(([k,v])=>'<div class="panel"><div class="muted">'+k+'</div><h1>'+v+'</h1></div>').join("");
$("accountList").innerHTML=accounts.map(a=>'<div class="item row"><div><strong>'+safe(a.label)+'</strong><div class="muted">'+safe(a.username?"@"+a.username:"ID "+a.telegram_id)+'</div></div><div><span class="'+(a.connected?"status":"warning")+'">'+(a.connected?"연결됨":"연결 끊김")+'</span> <button class="secondary" onclick="switchAccount('+a.id+','+(!a.enabled)+')">'+(a.enabled?"중지":"재연결")+'</button></div></div>').join("")||'<p class="muted">등록된 계정이 없습니다.</p>';
const options=accounts.filter(a=>a.connected).map(a=>'<option value="'+a.id+'">'+safe(a.label)+'</option>').join("");$("watcher").innerHTML=options;$("fixed").innerHTML=options;
$("routeList").innerHTML=routes.map(r=>'<div class="item row"><div><strong>메인방 '+r.source_chat+' → '+r.target_chat+'</strong><div class="muted">'+accountName(r.watcher_id)+' · '+(r.mode==="same"?"원본 작성자":accountName(r.fixed_id))+'</div></div><button class="secondary" onclick="switchRoute('+r.id+','+(!r.active)+')">'+(r.active?"중지":"시작")+'</button></div>').join("")||'<p class="muted">아직 등록된 전달 규칙이 없습니다.</p>';
const logs=await api("/logs");$("logList").innerHTML=logs.map(l=>'<div class="item"><strong>'+(l.status==="sent"?"전송 완료":"전송 실패")+'</strong> <span class="muted">규칙 '+l.route_id+' · '+safe(l.created_at)+'</span><div class="muted">'+safe(l.error||"")+'</div></div>').join("")||'<p class="muted">아직 전송 기록이 없습니다.</p>';
if(accounts.some(a=>a.connected))await loadSource()})}
async function sendCode(){await run(async()=>{const v=await api("/accounts/phone/start","POST",{phone:$("phone").value.trim()});token=v.token;$("verifyBox").classList.remove("hide");notice("텔레그램 앱으로 받은 코드를 입력하세요")})}
async function verify(){await run(async()=>{const v=await api("/accounts/phone/finish","POST",{token,code:$("code").value,password:$("twofa").value,label:$("phoneLabel").value});if(v.password_required){notice("2단계 인증 비밀번호를 입력하세요");return}$("code").value="";$("twofa").value="";$("verifyBox").classList.add("hide");notice("계정 연결 완료");await refresh()})}
async function importSession(){await run(async()=>{await api("/accounts/session","POST",{label:$("sessionLabel").value,session:$("stringSession").value.trim()});$("stringSession").value="";notice("세션 연결 완료");await refresh()})}
async function switchAccount(id,enabled){await run(async()=>{await api("/accounts/"+id,"PATCH",{enabled});await refresh()})}
async function loadSource(){await run(async()=>{const id=$("watcher").value;if(!id)return;dialogs=await api("/accounts/"+id+"/chats");const options=dialogs.map(d=>'<option value="'+d.id+'">'+safe(d.name)+'</option>').join("");$("source").innerHTML=options;$("targets").innerHTML=dialogs.map(d=>'<label class="check"><input type="checkbox" value="'+d.id+'" class="targetCheck"><span>'+safe(d.name)+'</span></label>').join("")})}
function toggleFixed(){$("fixedBox").classList.toggle("hide",$("sendMode").value!=="fixed")}
async function createRoutes(){await run(async()=>{const selected=[...document.querySelectorAll(".targetCheck:checked")].map(e=>Number(e.value));if(!selected.length)throw Error("전달할 서브방을 선택하세요");const src=Number($("source").value),watcher=Number($("watcher").value),mode=$("sendMode").value;let count=0;for(const target of selected){if(src===target)continue;await api("/routes","POST",{watcher_id:watcher,source_chat:src,target_chat:target,mode,fixed_id:mode==="fixed"?Number($("fixed").value):null});count++}notice(count+"개 그룹 연결 완료");await refresh()})}
async function switchRoute(id,enabled){await run(async()=>{await api("/routes/"+id,"PATCH",{enabled});await refresh()})}
start().catch(()=>{});
</script></body></html>
